services:
  tennis-reels:
    build: ./short-balls
    image: tennis-reels
    environment:
      HOST_UID: ${UID:-1000}
      HOST_GID: ${GID:-1000}
    volumes:
      - type: bind
        source: ./short-balls/inputs
        target: /work/inputs
        bind:
          create_host_path: true
      - type: bind
        source: ./short-balls/reels
        target: /work/reels
        bind:
          create_host_path: true
